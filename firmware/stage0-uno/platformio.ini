; Mimic Stage 0. https://docs.platformio.org/page/projectconf.html
;
;   [env:uno]     cross-compiled for the ATmega328P, uploaded to the board
;   [env:native]  compiled and run on this machine, no board attached

; Project wide settings - what env runs when with pio run and no -e flag
[platformio]
default_envs = uno

; Shared base that both environments get
[env]
build_flags =
    -Wall
    -Wextra

; Build that cross compiles for the ATmega328P and uploads to the board
[env:uno]
platform  = atmelavr@^5.3.0
board     = uno
framework = arduino

; The serial baud rate, set to 250000 becasue it divides the 16 MHz clock exactly: 0.0% UART error against 2.1% at 115200
monitor_speed = 250000

; Commented out so PlatformIO auto detects the board and uncomment if it picks wrong port
; upload_port  = /dev/ttyACM0
; monitor_port = /dev/ttyACM0

; The build that compiles and runs on this machine with no board attached (for host side unit tests)
[env:native]
platform = native@^1.2.1
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=c++17
    -I include
