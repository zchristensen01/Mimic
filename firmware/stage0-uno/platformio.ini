; Mimic Stage 0. https://docs.platformio.org/page/projectconf.html
;
;   [env:uno]     cross-compiled for the ATmega328P and uploaded to the board.
;   [env:native]  compiled and run on this machine, no board attached.

[platformio]
default_envs = uno

[env]
build_flags =
    -Wall
    -Wextra

; The @ pins the toolchain version. Without it, a clean checkout builds with
; whatever is newest that day, which is how CI and this machine drift apart.
; ^5.3.0 means 5.3.0 or newer but not 6, so fixes still arrive and the breaking
; change does not. Raise it deliberately, not because a build went red.
[env:uno]
platform  = atmelavr@^5.3.0
board     = uno
framework = arduino

; 250000 baud divides the 16 MHz clock exactly: 0.0% UART error against 2.1% at
; 115200. See Stage 0 Workbook, S7.
monitor_speed = 250000

; Set these once you know which port the board enumerates on. Unset means
; auto-detect, which occasionally picks a Bluetooth serial port instead.
; upload_port  = COM3
; monitor_port = COM3

; TODO (S12): this environment cannot build until the classes have
; implementations. Until then CI builds only [env:uno].
[env:native]
platform = native@^1.2.1
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=c++17
    -I include
